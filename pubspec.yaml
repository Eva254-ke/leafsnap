name: leafsnap_ai
description: "Identify plants, diagnose issues, and get personalized care tips — all offline-first."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^8.0.2
  posthog_flutter: ^5.24.0
  lottie: ^3.3.3

  # Networking & API
  http: ^1.2.2
  flutter_dotenv: ^5.1.0

  # Local Storage & Caching
  shared_preferences: ^2.2.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Media & Camera
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # Location Services
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Firebase (Auth, Firestore, Storage)
  firebase_core: ^3.4.1
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  google_sign_in: ^6.1.4

  # Utilities
  url_launcher: ^6.2.1          # Open URLs, email, app stores
  package_info_plus: ^4.1.0     # App version/build info
  permission_handler: ^11.0.1   # Runtime permission requests
  share_plus: ^7.2.1            # Native share sheet (fallback: clipboard)

  # Cupertino icons for iOS-style icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/animations/
    - assets/animations/realistic_leaf_scan.json
    - assets/icons/
    # Add local images here if needed:
    # - assets/images/

  # Example: custom fonts (uncomment and add font files if needed)
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
